<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RMS Price Database</title>
<style>
:root{
  --bg:#FBFBFA; --surface:#FFFFFF; --hover:#F4F4F1; --line:#E9E9E5; --line2:#D9D9D3;
  --text:#151514; --muted:#6D6D67; --faint:#A0A09A;
  --good:#0E7A55; --good-bg:#E7F4EC; --shadow:0 1px 2px rgba(20,20,18,.04), 0 8px 30px rgba(20,20,18,.06);
  --font:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'SF Pro Text','Helvetica Neue',Roboto,Arial,sans-serif;
  --l0:#C26A00; --l1:#2563EB; --l2:#7C3AED; --l3:#DC4A2B; --l4:#D1327F; --l5:#0E8FA3; --l6:#4D7C0F; --l7:#8A6D3B;
}
html[data-theme="dark"]{
  --bg:#0B0B0C; --surface:#131314; --hover:#18181A; --line:#232326; --line2:#34343A;
  --text:#F1F1EF; --muted:#9A9AA2; --faint:#62626A;
  --good:#4ADE9A; --good-bg:#0F2419; --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 40px rgba(0,0,0,.45);
  --l0:#F5B04C; --l1:#6EA2FF; --l2:#A78BFA; --l3:#FB8C6A; --l4:#F472B6; --l5:#4CC7DA; --l6:#9BD14B; --l7:#D2B07A;
}
*{ box-sizing:border-box; }
html,body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; }
body{ min-height:100vh; }
button,select,input{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:2px solid var(--text); outline-offset:2px; border-radius:6px; }

/* ── top bar ── */
.top{ position:sticky; top:0; z-index:20; height:56px; display:flex; align-items:center; gap:10px; padding:0 20px;
  background:color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter:saturate(1.4) blur(12px); -webkit-backdrop-filter:saturate(1.4) blur(12px); }
.brand{ white-space:nowrap; font-weight:650; font-size:16px; letter-spacing:-.02em; display:flex; align-items:center; gap:9px; margin-right:auto; }
.brand i{ width:18px; height:18px; border-radius:6px; background:var(--text); display:inline-block; position:relative; }
.brand i::after{ content:""; position:absolute; inset:5px; border-radius:50%; background:var(--bg); }
.seg{ display:inline-flex; padding:2px; border:1px solid var(--line); border-radius:10px; background:var(--surface); }
.seg button{ border:0; background:transparent; height:28px; padding:0 11px; border-radius:8px; color:var(--muted); font-size:13px; font-weight:550; }
.seg button[aria-pressed="true"]{ background:var(--text); color:var(--bg); }
.icon{ width:36px; height:36px; display:grid; place-items:center; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--text); }
.icon:hover,.btn:hover{ border-color:var(--line2); background:var(--hover); }
.btn{ height:36px; padding:0 13px; border:1px solid var(--line); border-radius:10px; background:var(--surface); font-size:13.5px; font-weight:550;
  display:inline-flex; align-items:center; gap:8px; }
.count{ min-width:20px; height:20px; padding:0 6px; border-radius:99px; background:var(--text); color:var(--bg); font-size:12px; font-weight:600; display:inline-grid; place-items:center; }
.count[data-n="0"]{ background:var(--line2); color:var(--muted); }

/* ── search ── */
main{ max-width:880px; margin:0 auto; padding:0 20px 80px; }
.hero{ padding-top:15vh; transition:padding .35s cubic-bezier(.2,.7,.2,1); }
main.active .hero{ padding-top:14px; }
h1{ margin:0 0 22px; font-size:42px; line-height:1.08; font-weight:600; letter-spacing:-.035em; text-wrap:balance; max-width:16ch; }
main.active h1,main.active .hint,main.active .legend{ display:none; }
.search{ display:flex; align-items:center; gap:12px; height:58px; padding:0 18px; border:1px solid var(--line2); border-radius:16px;
  background:var(--surface); box-shadow:var(--shadow); transition:border-color .15s, box-shadow .15s; }
.search:focus-within{ border-color:var(--text); }
.search svg{ flex:none; color:var(--muted); }
.search input{ flex:1; min-width:0; border:0; outline:0; background:transparent; font-size:18px; letter-spacing:-.01em; }
.search input::placeholder{ color:var(--faint); }
.search kbd{ font:inherit; font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:1px 7px; }
.search .x{ display:none; border:0; background:var(--hover); width:26px; height:26px; border-radius:50%; color:var(--muted); }
main.active .search kbd{ display:none; } main.active .search .x{ display:block; }
.hint{ margin:16px 2px 0; color:var(--muted); font-size:14px; }
.hint button{ border:0; background:none; padding:0; margin-left:14px; color:var(--text); text-decoration:underline; text-decoration-color:var(--line2); text-underline-offset:4px; font-size:14px; }
.hint button:hover{ text-decoration-color:var(--text); }
.legend{ margin-top:46px; display:flex; flex-wrap:wrap; gap:8px 20px; color:var(--muted); font-size:13px; }
.legend span{ display:inline-flex; align-items:center; gap:7px; }
.legend small{ color:var(--faint); font-size:12px; }

/* ── results ── */
.dot{ width:8px; height:8px; border-radius:50%; background:var(--c); flex:none; display:inline-block; }
.tabs{ display:flex; gap:22px; overflow-x:auto; margin-top:18px; border-bottom:1px solid var(--line); scrollbar-width:none; }
.tabs::-webkit-scrollbar{ display:none; }
.tabs button{ flex:none; border:0; background:none; padding:10px 0 11px; color:var(--muted); font-size:14px; font-weight:500; border-bottom:2px solid transparent; margin-bottom:-1px;
  display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
.tabs button small{ font-size:12px; color:var(--faint); }
.tabs button[aria-selected="true"]{ color:var(--text); border-bottom-color:var(--text); }
.rhead{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:14px 2px 6px; color:var(--muted); font-size:13.5px; }
.rhead .sp{ margin-left:auto; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.link{ border:0; background:none; padding:0; color:var(--text); font-size:13.5px; font-weight:550; text-decoration:underline; text-decoration-color:var(--line2); text-underline-offset:4px; }
.link:hover{ text-decoration-color:var(--text); }
.rhead select{ border:0; background:none; font-size:13.5px; color:var(--text); font-weight:550; padding:0; cursor:pointer; }
ul#rows{ list-style:none; margin:0; padding:0; }
.row{ display:grid; grid-template-columns:minmax(0,1fr) auto 36px; gap:18px; align-items:center; padding:15px 4px; border-bottom:1px solid var(--line); }
.row:hover{ background:linear-gradient(90deg, transparent, var(--hover) 40px, var(--hover) calc(100% - 40px), transparent); }
.name{ font-size:15.5px; font-weight:500; line-height:1.35; overflow-wrap:anywhere; }
.name mark{ background:none; color:inherit; box-shadow:inset 0 -2px 0 color-mix(in srgb, var(--text) 22%, transparent); }
.sub{ display:flex; flex-wrap:wrap; align-items:center; gap:3px 14px; margin-top:5px; font-size:13px; color:var(--muted); }
.chip{ display:inline-flex; align-items:center; gap:7px; color:var(--text); font-weight:500; }
.price{ text-align:right; font-size:16px; font-weight:600; letter-spacing:-.01em; white-space:nowrap; }
.price small{ display:block; font-size:12.5px; font-weight:400; color:var(--muted); letter-spacing:0; margin-top:1px; }
.price.low{ color:var(--good); }
.pill{ font-size:11.5px; font-weight:600; color:var(--good); background:var(--good-bg); padding:2px 8px; border-radius:99px; margin-right:9px; letter-spacing:0; vertical-align:2px; }
.add{ width:34px; height:34px; border-radius:50%; border:1px solid var(--line2); background:var(--surface); display:grid; place-items:center; color:var(--text); transition:background .12s, color .12s, border-color .12s; }
.add:hover{ border-color:var(--text); }
.add[aria-pressed="true"]{ background:var(--text); color:var(--bg); border-color:var(--text); }
.note{ padding:28px 0 8px; color:var(--muted); font-size:13px; }
.empty{ padding:56px 0; text-align:center; color:var(--muted); }
.empty b{ display:block; font-size:18px; font-weight:600; color:var(--text); margin-bottom:6px; letter-spacing:-.01em; }
.empty button{ margin:14px 6px 0; }

/* ── compare drawer ── */
#scrim{ position:fixed; inset:0; background:rgba(10,10,10,.32); opacity:0; pointer-events:none; transition:opacity .2s; z-index:40; }
#drawer{ position:fixed; top:0; right:0; bottom:0; width:min(480px,100vw); background:var(--bg); border-left:1px solid var(--line); z-index:50;
  transform:translateX(102%); transition:transform .28s cubic-bezier(.2,.7,.2,1); display:flex; flex-direction:column; box-shadow:var(--shadow); }
body.cmp #drawer{ transform:none; } body.cmp #scrim{ opacity:1; pointer-events:auto; }
.dh{ display:flex; align-items:center; gap:10px; padding:16px 20px; border-bottom:1px solid var(--line); }
.dh h2{ margin:0; font-size:17px; font-weight:600; letter-spacing:-.015em; margin-right:auto; }
.db{ flex:1; overflow:auto; padding:6px 20px 20px; }
.sum{ margin:14px 0 6px; font-size:14px; color:var(--muted); line-height:1.55; }
.sum b{ color:var(--text); font-weight:600; }
.rung{ display:grid; grid-template-columns:minmax(0,1fr) auto 30px; gap:6px 14px; align-items:center; padding:14px 0; border-bottom:1px solid var(--line); }
.rung .name{ font-size:14.5px; }
.rung .bar{ grid-column:1; grid-row:2; height:4px; border-radius:9px; background:var(--line); overflow:hidden; }
.rung .bar i{ display:block; height:100%; background:var(--c); border-radius:9px; }
.rung .price{ font-size:15px; }
.rung .d{ grid-column:2; grid-row:2; text-align:right; font-size:12px; color:var(--muted); font-weight:600; white-space:nowrap; }
.rung.low .d{ color:var(--good); }
.rung .rm{ grid-column:3; grid-row:1; width:28px; height:28px; border-radius:50%; border:0; background:transparent; color:var(--muted); display:grid; place-items:center; }
.rung .rm:hover{ background:var(--hover); color:var(--text); }
.df{ display:flex; gap:10px; padding:14px 20px; border-top:1px solid var(--line); }
.df .btn{ flex:1; justify-content:center; }
.df .btn.primary{ background:var(--text); color:var(--bg); border-color:var(--text); }
.caveat{ font-size:12.5px; color:var(--faint); margin-top:14px; line-height:1.5; }

#toast{ position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); background:var(--text); color:var(--bg); padding:10px 16px; border-radius:12px;
  font-size:13.5px; font-weight:500; opacity:0; pointer-events:none; transition:all .25s; z-index:60; max-width:90vw; }
#toast.on{ opacity:1; transform:translate(-50%,0); }

@media (max-width:640px){
  .top{ padding:0 12px; gap:8px; } .reserve{ width:44px; } h1{ font-size:32px; }
  main{ padding:0 14px 70px; } .hero{ padding-top:9vh; } .search{ height:52px; } .search input{ font-size:16px; }
  .row{ grid-template-columns:minmax(0,1fr) auto 34px; gap:12px; } .btn .lbl{ display:none; }
  .rhead .sp{ margin-left:0; width:100%; justify-content:space-between; }
}
@media (max-width:430px){ .brand span{ display:none; } }
@media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="brand"><i></i><span>RMS Prices</span></div>
  <div class="seg" id="cur" role="group" aria-label="Currency">
    <button data-v="USD">USD</button><button data-v="RWF">RWF</button>
  </div>
  <button class="icon" id="theme" aria-label="Switch between light and dark"></button>
  <button class="btn" id="openCmp" aria-label="Open compare"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M4 17h16M4 12h6"/></svg><span class="lbl">Compare</span><span class="count" id="cmpN" data-n="0">0</span></button>
  <button class="btn" id="manage" aria-label="Manage price lists"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span class="lbl">Manage</span></button>
</header>

<main id="main">
  <section class="hero">
    <h1>Search medicine and supply prices</h1>
    <label class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="q" type="text" inputmode="search" autocomplete="off" spellcheck="false" placeholder="Try amoxicillin 500mg" aria-label="Search prices">
      <kbd>/</kbd>
      <button class="x" id="clear" type="button" aria-label="Clear search"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </label>
    <p class="hint" id="hint">Loading prices…</p>
    <div class="legend" id="legend"></div>
  </section>

  <section id="results" hidden>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="rhead">
      <span id="count"></span>
      <span class="sp">
        <button class="link" id="lowest" type="button">Add lowest from each list</button>
        <select id="sort" aria-label="Sort results">
          <option value="best">Best match</option><option value="asc">Price, low to high</option>
          <option value="desc">Price, high to low</option><option value="name">Name</option>
        </select>
        <button class="link" id="export" type="button">Export CSV</button>
      </span>
    </div>
    <ul id="rows"></ul>
    <div id="sentinel"></div>
    <p class="note" id="foot"></p>
  </section>
</main>

<div id="scrim"></div>
<aside id="drawer" aria-label="Compare" aria-hidden="true">
  <div class="dh"><h2>Compare</h2>
    <button class="icon" id="closeCmp" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="db" id="cmpBody"></div>
  <div class="df" id="cmpFoot"><button class="btn" id="cmpExport">Export CSV</button><button class="btn primary" id="cmpClear">Clear all</button></div>
</aside>
<div id="toast" role="status"></div>

<script type="application/json" id="data">__DATA__</script>
<script>
"use strict";
/* if anything goes wrong, say so on the page instead of leaving it silent */
function fail(msg){ const h = document.getElementById('hint'); if (h){ h.style.color = '#B3261E'; h.textContent = 'Something went wrong while loading: ' + msg; } }
window.addEventListener('error', e => fail(e.message || 'unknown error'));
/* ───────────────────────── data ───────────────────────── */
const D = JSON.parse(document.getElementById('data').textContent);
const N = D.n, C = D.cols, DI = D.dict, LISTS = D.lists, FX = D.fx;
const PAGE = 40, MAX_TRAY = 12;
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};

/* normalised text used for searching: lower-case, no accents, "500mg" -> "500 mg", words split on punctuation */
function norm(s){
  s = String(s).normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  s = s.replace(/(\d),(?=\d)/g, '$1.').replace(/(\d)(?=[a-z])/g, '$1 ');
  s = s.replace(/\.(?!\d)|(?<!\d)\./g, ' ').replace(/[^a-z0-9.]+/g, ' ').trim();
  return ' ' + s + ' ';
}
const NAME = new Array(N), ALL = new Array(N);
for (let i = 0; i < N; i++){
  const p = C.p[i];
  NAME[i] = norm(p);
  ALL[i] = norm(p + ' ' + DI.detail[C.detail[i]] + ' ' + DI.sub[C.sub[i]] + ' ' + DI.cat[C.cat[i]]);
}

/* ───────────────────────── state ───────────────────────── */
let cur = store.get('rms-cur', 'USD');
let theme = store.get('rms-theme', 'light');
let query = '', listFilter = -1, sortBy = 'best', shown = 0;
let matches = [];            // row indices after search + list filter + sort
let LOW = Infinity;          // lowest price among the matches (in the chosen currency)
let base = null;             // search result before the list filter: {idx, score, toks, mode}
let tray = [];               // row indices being compared

/* ───────────────────────── formatting ───────────────────────── */
function fmtUSD(v){ if (v == null) return ''; return v >= 1 ? '$' + v.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})
  : v >= 0.1 ? '$' + v.toFixed(3) : v >= 0.0001 ? '$' + v.toFixed(4) : '<$0.0001'; }
function fmtRWF(v){ if (v == null) return ''; return 'RWF ' + (v >= 100 ? Math.round(v).toLocaleString('en-US')
  : v >= 10 ? v.toFixed(1) : v.toFixed(2)); }
const money = (v, c) => c === 'USD' ? fmtUSD(v) : fmtRWF(v);
const other = () => cur === 'USD' ? 'RWF' : 'USD';
const price = (i, c = cur) => c === 'USD' ? C.u[i] : C.r[i];
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const pack = i => DI.pack[C.pack[i]], detail = i => DI.detail[C.detail[i]], cat = i => DI.cat[C.cat[i]], note = i => DI.note[C.note[i]];
const listOf = i => LISTS[C.l[i]];

/* ───────────────────────── search ───────────────────────── */
function runSearch(q){
  const toks = norm(q).match(/[a-z0-9]+(?:\.\d+)?/g) || [];
  if (!toks.length) return {idx: [], score: [], toks, mode: 'none'};
  for (const mode of ['word', 'sub']){
    const idx = [], score = [];
    const keys = toks.map(t => mode === 'word' ? ' ' + t : t);
    for (let i = 0; i < N; i++){
      const a = ALL[i], nm = NAME[i];
      let s = 0, ok = true;
      for (let k = 0; k < keys.length; k++){
        if (!a.includes(keys[k])){ ok = false; break; }
        s += 1 + (nm.includes(keys[k]) ? 2 : 0);
      }
      if (ok){ if (nm.startsWith(' ' + toks[0])) s += 3; idx.push(i); score.push(s); }
    }
    if (idx.length) return {idx, score, toks, mode};
  }
  return {idx: [], score: [], toks, mode: 'none'};
}

function rebuild(){
  base = query.trim() ? runSearch(query) : null;
  applyFilter();
}
function applyFilter(){
  if (!base){ matches = []; return render(); }
  let idx = base.idx.map((i, k) => [i, base.score[k]]);
  if (listFilter >= 0) idx = idx.filter(([i]) => C.l[i] === listFilter);
  const p = i => price(i) ?? Infinity;
  if (sortBy === 'asc') idx.sort((a, b) => p(a[0]) - p(b[0]));
  else if (sortBy === 'desc') idx.sort((a, b) => p(b[0]) - p(a[0]));
  else if (sortBy === 'name') idx.sort((a, b) => NAME[a[0]] < NAME[b[0]] ? -1 : 1);
  else idx.sort((a, b) => b[1] - a[1] || p(a[0]) - p(b[0]));
  matches = idx.map(x => x[0]);
  LOW = Infinity; for (const i of matches){ const v = price(i); if (v != null && v < LOW) LOW = v; }
  shown = 0;
  render();
}

/* ───────────────────────── rendering: results ───────────────────────── */
const main = $('main'), rowsEl = $('rows');
function hl(text){
  let out = esc(text);
  if (!base) return out;
  for (const t of base.toks){
    if (t.length < 2) continue;
    out = out.replace(new RegExp('(^|[^A-Za-z0-9])(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '$1<mark>$2</mark>');
  }
  return out;
}
function rowHTML(i, lowest){
  const L = listOf(i), p = price(i), alt = price(i, other());
  const bits = [];
  if (detail(i) && norm(detail(i)) !== NAME[i]) bits.push(esc(detail(i)));
  if (pack(i)) bits.push('pack ' + esc(pack(i)));
  if (note(i)) bits.push(L.label.startsWith('RHIA') ? 'prescriber ' + esc(note(i)) : esc(note(i)));
  if (cat(i) && cat(i) !== 'Uncategorised') bits.push(esc(cat(i)));
  const on = tray.includes(i);
  const tip = L.cur === other() ? `Published in ${L.cur}; ${cur} converted at ${FX.toLocaleString('en-US')}` : '';
  return `<li class="row" data-i="${i}"><div><div class="name">${hl(C.p[i])}</div>
<div class="sub"><span class="chip" style="--c:var(--l${L.color})"><span class="dot"></span>${esc(L.label)}</span>${bits.map(b => `<span>${b}</span>`).join('')}</div></div>
<div class="price ${lowest ? 'low' : ''}" ${tip ? `title="${esc(tip)}"` : ''}>${lowest ? '<span class="pill">Lowest</span>' : ''}${money(p, cur)}<small>${money(alt, other())}</small></div>
<button class="add" data-add="${i}" aria-pressed="${on}" aria-label="${on ? 'Remove from compare' : 'Add to compare'}">${on
  ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
  : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'}</button></li>`;
}
function moreRows(){
  if (shown >= matches.length) return;
  const end = Math.min(shown + PAGE, matches.length);
  let html = '';
  for (let k = shown; k < end; k++){ const i = matches[k]; html += rowHTML(i, matches.length > 1 && price(i) === LOW); }
  rowsEl.insertAdjacentHTML('beforeend', html);
  shown = end;
}
function render(){
  const active = !!base;
  main.classList.toggle('active', active);
  $('results').hidden = !active;
  if (!active) return;

  // tabs: one per list that has matches
  const counts = new Map();
  for (const i of base.idx){ counts.set(C.l[i], (counts.get(C.l[i]) || 0) + 1); }
  const tabs = [[-1, 'All', base.idx.length, null]];
  [...counts.entries()].sort((a, b) => b[1] - a[1]).forEach(([l, n]) => tabs.push([l, LISTS[l].label, n, LISTS[l].color]));
  $('tabs').innerHTML = tabs.map(([l, label, n, c]) => `<button role="tab" data-l="${l}" aria-selected="${l === listFilter}">${c !== null ? `<span class="dot" style="--c:var(--l${c})"></span>` : ''}${esc(label)} <small>${n.toLocaleString('en-US')}</small></button>`).join('');

  rowsEl.innerHTML = '';
  $('sort').value = sortBy;
  $('lowest').hidden = counts.size < 2;
  if (!matches.length){
    $('count').textContent = '';
    const tips = base.toks.length ? suggest(base.toks[0]) : [];
    rowsEl.innerHTML = `<li class="empty"><b>No matches for “${esc(query.trim())}”</b>Try fewer words or a shorter spelling.${tips.length ? '<div>' + tips.map(t => `<button class="btn" data-q="${esc(t)}">${esc(t)}</button>`).join('') + '</div>' : ''}</li>`;
    $('foot').textContent = '';
    return;
  }
  $('count').textContent = `${matches.length.toLocaleString('en-US')} ${matches.length === 1 ? 'result' : 'results'}` + (base.mode === 'sub' ? ', matched inside words' : '');
  moreRows();
  $('foot').textContent = 'Prices are per selling unit as published. Check the pack before comparing across lists.'
    + (LISTS.some(l => l.cur === 'RWF') ? ` Lists published in RWF show USD converted at ${FX.toLocaleString('en-US')}.` : '');
}

/* did-you-mean: edit distance against the words in product names */
let VOCAB = null;
function suggest(word){
  if (word.length < 4) return [];
  if (!VOCAB){ const m = new Map(); for (let i = 0; i < N; i++) for (const w of NAME[i].trim().split(' ')) if (w.length > 3 && /^[a-z]+$/.test(w)) m.set(w, (m.get(w) || 0) + 1); VOCAB = [...m.entries()]; }
  const maxd = word.length > 6 ? 2 : 1, out = [];
  for (const [w, n] of VOCAB){
    if (Math.abs(w.length - word.length) > maxd || w[0] !== word[0]) continue;
    const d = lev(word, w, maxd);
    if (d <= maxd) out.push([d, -n, w]);
  }
  return out.sort((a, b) => a[0] - b[0] || a[1] - b[1]).slice(0, 4).map(x => x[2]);
}
function lev(a, b, max){
  let prev = Array.from({length: b.length + 1}, (_, j) => j);
  for (let i = 1; i <= a.length; i++){
    const cur = [i]; let best = i;
    for (let j = 1; j <= b.length; j++){ cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); best = Math.min(best, cur[j]); }
    if (best > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}

/* ───────────────────────── compare ───────────────────────── */
const rowKey = i => C.l[i] + '|' + C.p[i] + '|' + pack(i);
function saveTray(){ store.set('rms-tray', JSON.stringify(tray.map(rowKey))); }
function loadTray(){
  let keys = []; try{ keys = JSON.parse(store.get('rms-tray', '[]')); }catch(e){}
  if (!keys.length) return;
  const want = new Set(keys), found = new Map();
  for (let i = 0; i < N && found.size < want.size; i++){ const k = rowKey(i); if (want.has(k)) found.set(k, i); }
  tray = keys.map(k => found.get(k)).filter(i => i !== undefined);
}
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 1800); }
function toggle(i){
  const at = tray.indexOf(i);
  if (at >= 0) tray.splice(at, 1);
  else if (tray.length >= MAX_TRAY) return toast(`Compare holds ${MAX_TRAY} items. Remove one first.`);
  else { tray.push(i); toast('Added to compare'); }
  saveTray(); syncTray();
}
function syncTray(){
  const n = $('cmpN'); n.textContent = tray.length; n.dataset.n = tray.length;
  document.querySelectorAll('.add').forEach(b => {
    const on = tray.includes(+b.dataset.add);
    b.setAttribute('aria-pressed', on);
    b.setAttribute('aria-label', on ? 'Remove from compare' : 'Add to compare');
    b.innerHTML = on ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
                     : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  });
  renderCompare();
}
function renderCompare(){
  const body = $('cmpBody'), foot = $('cmpFoot');
  foot.style.display = tray.length ? 'flex' : 'none';
  if (!tray.length){
    body.innerHTML = '<div class="empty"><b>Nothing to compare yet</b>Press + on a result to add it here, or use “Add lowest from each list” after a search.</div>';
    return;
  }
  const items = [...tray].sort((a, b) => price(a) - price(b));
  const lo = price(items[0]), hi = price(items[items.length - 1]);
  let sum = '';
  if (items.length > 1){
    sum = `<p class="sum"><b>${esc(C.p[items[0]])}</b> from ${esc(listOf(items[0]).label)} is lowest at <b>${money(lo, cur)}</b>. The highest costs <b>${(hi / lo).toFixed(1)}×</b> as much (${money(hi, cur)}).</p>`;
  } else sum = '<p class="sum">Add one more product to see how they compare.</p>';
  body.innerHTML = sum + items.map(i => {
    const L = listOf(i), p = price(i), isLow = items.length > 1 && p === lo, r = p / lo;
    const d = items.length === 1 ? '' : isLow ? 'Lowest' : r >= 10 ? r.toFixed(1) + '× lowest' : '+' + Math.round((r - 1) * 100) + '%';
    const meta = [detail(i) && norm(detail(i)) !== NAME[i] ? esc(detail(i)) : '', pack(i) ? 'pack ' + esc(pack(i)) : ''].filter(Boolean).join(', ');
    return `<div class="rung ${isLow ? 'low' : ''}" style="--c:var(--l${L.color})">
<div><div class="name">${esc(C.p[i])}</div><div class="sub"><span class="chip"><span class="dot"></span>${esc(L.label)}</span>${meta ? `<span>${meta}</span>` : ''}</div></div>
<div class="price">${money(p, cur)}<small>${money(price(i, other()), other())}</small></div>
<button class="rm" data-rm="${i}" aria-label="Remove">${'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'}</button>
<div class="bar"><i style="width:${Math.max(p / hi * 100, 2).toFixed(1)}%"></i></div><div class="d">${d}</div></div>`;
  }).join('') + '<p class="caveat">Strength, form and pack size can differ between rows. Compare like with like before relying on the gap.</p>';
}
function openCompare(open){
  document.body.classList.toggle('cmp', open);
  $('drawer').setAttribute('aria-hidden', !open);
  if (open) renderCompare();
}
function addLowestEach(){
  if (!base) return;
  const best = new Map();
  for (const i of base.idx){ const l = C.l[i]; if (!best.has(l) || (C.u[i] ?? Infinity) < (C.u[best.get(l)] ?? Infinity)) best.set(l, i); }
  let added = 0;
  for (const i of best.values()){ if (!tray.includes(i) && tray.length < MAX_TRAY){ tray.push(i); added++; } }
  saveTray(); syncTray();
  toast(added ? `Added ${added} to compare` : 'Already in compare');
  if (added) openCompare(true);
}

/* ───────────────────────── export ───────────────────────── */
function csv(indices){
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const head = ['List', 'Product', 'Details', 'Pack', 'Category', 'Note', 'USD', 'RWF'];
  return '\ufeff' + [head.join(',')].concat(indices.map(i => [listOf(i).label, C.p[i], detail(i), pack(i), cat(i), note(i), C.u[i], C.r[i]].map(q).join(','))).join('\r\n');
}
function download(name, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: 'text/csv;charset=utf-8'}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ───────────────────────── theme + currency ───────────────────────── */
const ICON_MOON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
const ICON_SUN = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function applyTheme(){
  document.documentElement.dataset.theme = theme;
  $('theme').innerHTML = theme === 'dark' ? ICON_SUN : ICON_MOON;
  try{ window.parent.document.documentElement.setAttribute('data-rms-theme', theme); }catch(e){}   // lets the Streamlit button match
}
function applyCur(){
  document.querySelectorAll('#cur button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === cur));
}

/* ───────────────────────── wiring ───────────────────────── */
const q = $('q');
let timer;
q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { query = q.value; listFilter = -1; rebuild(); }, 70); });
$('clear').onclick = () => { q.value = ''; query = ''; listFilter = -1; rebuild(); q.focus(); };
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b){ listFilter = +b.dataset.l; applyFilter(); } });
$('sort').onchange = e => { sortBy = e.target.value; applyFilter(); };
$('lowest').onclick = addLowestEach;
$('export').onclick = () => matches.length && download('rms_prices.csv', csv(matches));
$('cmpExport').onclick = () => tray.length && download('rms_compare.csv', csv([...tray].sort((a, b) => price(a) - price(b))));
$('cmpClear').onclick = () => { tray = []; saveTray(); syncTray(); };
$('openCmp').onclick = () => openCompare(true);
$('closeCmp').onclick = () => openCompare(false);
$('scrim').onclick = () => openCompare(false);
$('theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; store.set('rms-theme', theme); applyTheme(); };
$('cur').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; cur = b.dataset.v; store.set('rms-cur', cur); applyCur(); applyFilter(); syncTray(); });
rowsEl.addEventListener('click', e => {
  const a = e.target.closest('[data-add]'); if (a) return toggle(+a.dataset.add);
  const s = e.target.closest('[data-q]'); if (s){ q.value = s.dataset.q; query = s.dataset.q; rebuild(); }
});
$('cmpBody').addEventListener('click', e => { const r = e.target.closest('[data-rm]'); if (r) toggle(+r.dataset.rm); });
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); q.focus(); }
  if (e.key === 'Escape'){ if (document.body.classList.contains('cmp')) openCompare(false); else if (q.value){ $('clear').click(); } }
});
new IntersectionObserver(es => { if (es[0].isIntersecting) moreRows(); }, {rootMargin: '800px'}).observe($('sentinel'));

/* ───────────────────────── Manage (opens Streamlit's native dialog) ───────────────────────── */
function nativeManage(){
  try{
    return [...window.parent.document.querySelectorAll('button')].find(b => b.textContent.trim().replace(/^\W+/, '') === 'Manage' && !b.closest('[data-testid="stIFrame"]'));
  }catch(e){ return null; }
}
$('manage').onclick = () => { const b = nativeManage(); if (b) b.click(); else toast('Manage is unavailable here. Scroll down to the Manage button.'); };
(function hideNative(tries){
  const b = nativeManage();
  if (b){ const box = b.closest('[data-testid="stElementContainer"]') || b.closest('.element-container') || b.parentElement; box.style.display = 'none'; }
  else if (tries > 0) setTimeout(() => hideNative(tries - 1), 400);
})(15);

/* ───────────────────────── start ───────────────────────── */
(function init(){
  const total = LISTS.reduce((s, l) => s + l.n, 0);
  $('hint').innerHTML = 'Try' + ['paracetamol', 'amoxicillin 500mg', 'insulin', 'surgical gloves'].map(t => `<button data-hint="${t}">${t}</button>`).join('');
  $('hint').addEventListener('click', e => { const b = e.target.closest('[data-hint]'); if (b){ q.value = b.dataset.hint; query = q.value; rebuild(); q.focus(); } });
  $('legend').innerHTML = LISTS.map(l => `<span style="--c:var(--l${l.color})" title="${l.n.toLocaleString('en-US')} prices"><i class="dot"></i>${esc(l.label)} <small>${l.n.toLocaleString('en-US')}</small></span>`).join('')
    + `<span style="flex-basis:100%;margin-top:4px;color:var(--faint)">${total.toLocaleString('en-US')} prices. 1 USD = ${FX.toLocaleString('en-US')} RWF.</span>`;
  if (!N){ $('hint').textContent = 'No price lists yet. Use Manage to add one.'; q.disabled = true; }
  loadTray(); applyTheme(); applyCur(); syncTray(); render();
  q.focus({preventScroll: true});
})();
</script>
</body>
</html>
